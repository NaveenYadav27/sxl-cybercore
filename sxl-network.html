<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--w:#fff;--red:#dc2626;--rl:#fecaca;--rd:#991b1b;--rh:#b91c1c;--bl:#0f0f0f;--g7:#404040;--g6:#525252;--g5:#737373;--g4:#a3a3a3;--g3:#d4d4d4;--g2:#e5e5e5;--g1:#f5f5f5;--g0:#fafafa;--grn:#16a34a;--grnb:#dcfce7;--amb:#d97706;--ambb:#fef3c7;--blu:#2563eb;--blub:#dbeafe;--pur:#7c3aed;--purb:#ede9fe;--cyn:#0891b2;--cynb:#cffafe;--pnk:#ec4899;--pnkb:#fce7f3;--r:12px;--rs:8px;--rxs:6px;--sh:0 1px 3px rgba(0,0,0,.08)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--bl);overflow:hidden;height:100vh}
.m{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--g3);border-radius:2px}
.app{display:grid;grid-template-columns:218px 1fr 280px;height:100vh}
.side{background:var(--w);border-right:1px solid var(--g2);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.logo{padding:13px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--g1);text-decoration:none;color:inherit}
.logo i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--red),var(--rd));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.72rem;font-style:normal}
.logo b{font-size:.85rem;letter-spacing:-.3px}b span{color:var(--red)}
.logo small{font-size:.52rem;color:var(--g4);display:block}
.nav{flex:1;padding:5px 0}
.ng{font-size:.54rem;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.08em;padding:8px 13px 2px}
.nb{display:flex;align-items:center;gap:7px;width:100%;padding:5px 13px;background:none;border:none;color:var(--g6);font-size:.72rem;font-weight:500;cursor:pointer;border-left:3px solid transparent;text-align:left;font-family:'Inter',sans-serif}
.nb:hover{color:var(--bl);background:var(--g0)}.nb.on{color:var(--red);background:rgba(220,38,38,.04);border-left-color:var(--red);font-weight:600}
.nb i{width:14px;text-align:center;font-size:.72rem}
.main{overflow-y:auto;padding:18px 22px;background:var(--bg)}
.pnl{display:none}.pnl.on{display:block}
.card{background:var(--w);border:1px solid var(--g2);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--g1)}
.ch h3{font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px}.ch h3 i{color:var(--red)}
.cb{padding:14px 15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mb{margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--w);border:1px solid var(--g2);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.st::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:0 3px 3px 0}
.st.red::before{background:var(--red)}.st.grn::before{background:var(--grn)}.st.blu::before{background:var(--blu)}.st.pur::before{background:var(--pur)}.st.amb::before{background:var(--amb)}
.st .sl{font-size:.6rem;font-weight:600;color:var(--g5);text-transform:uppercase;letter-spacing:.04em}
.st .sv{font-size:1.2rem;font-weight:800;margin-top:3px;font-family:'JetBrains Mono',monospace}
.st .si{position:absolute;top:10px;right:12px;font-size:1.4rem;opacity:.07}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:5px 10px;font-size:.6rem;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.04em;background:var(--g0);border-bottom:1px solid var(--g2);position:sticky;top:0}
td{padding:5px 10px;font-size:.72rem;border-bottom:1px solid var(--g1)}
tr:hover td{background:rgba(220,38,38,.01)}
.badge{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:.6rem;font-weight:700}
.badge.up{color:var(--grn);background:var(--grnb)}.badge.dn{color:var(--red);background:var(--rl)}.badge.idle{color:var(--amb);background:var(--ambb)}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.58rem;font-weight:700}
.tag.r{color:var(--red);background:rgba(220,38,38,.07)}.tag.b{color:var(--blu);background:var(--blub)}.tag.p{color:var(--pur);background:var(--purb)}.tag.c{color:var(--cyn);background:var(--cynb)}.tag.g{color:var(--grn);background:var(--grnb)}.tag.a{color:var(--amb);background:var(--ambb)}
.btn{padding:6px 13px;border-radius:var(--rxs);border:none;font-weight:600;font-size:.72rem;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn:active{transform:scale(.97)}.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:var(--rh)}.btn-o{background:var(--w);border:1px solid var(--g2);color:var(--g7)}.btn-o:hover{border-color:var(--red);color:var(--red)}.btn-g{background:var(--grn);color:#fff}
.btn-s{padding:4px 10px;font-size:.66rem}.btn-lg{padding:10px 22px;font-size:.82rem;border-radius:var(--rs)}
.inp{width:100%;padding:6px 10px;background:var(--g0);border:1px solid var(--g2);border-radius:var(--rxs);color:var(--bl);font-size:.8rem;outline:none;transition:.2s;font-family:'Inter',sans-serif;text-align:center;font-weight:600}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(220,38,38,.08)}
.lbl{font-size:.6rem;font-weight:600;color:var(--g5);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;display:block;text-align:center}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cht{position:relative}.cht.h200{height:200px}.cht.h160{height:160px}.cht.h140{height:140px}
.term{background:#0a0a0a;color:#00ff41;font-family:'JetBrains Mono',monospace;font-size:.68rem;padding:12px;border-radius:var(--rs);max-height:380px;overflow-y:auto;line-height:1.5;white-space:pre-wrap}
.formula{font-family:'JetBrains Mono',monospace;font-size:.82rem;background:var(--w);border:1px solid var(--g2);padding:7px 12px;border-radius:var(--rs);margin:6px 0;color:var(--red);font-weight:600}
.binary-row{display:flex;gap:0;margin:6px 0;font-family:'JetBrains Mono',monospace}
.binary-row .octet{display:flex;flex-direction:column;align-items:center;min-width:58px}
.binary-row .octet .bits{display:flex;gap:1px}
.binary-row .octet .bit{width:14px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;border:1px solid var(--g2);background:var(--g0);transition:.2s}
.binary-row .octet .bit.nb{background:var(--rl);border-color:var(--red);color:var(--red)}
.binary-row .octet .bit.hb{background:var(--g0);color:var(--g6)}
.binary-row .octet .bit.mb{background:rgba(220,38,38,.15);border-color:var(--red);color:var(--red);font-weight:800}
.binary-row .octet .dec{font-size:.75rem;font-weight:700;margin-top:2px;color:var(--g6)}
.binary-row .ds{font-size:1.1rem;font-weight:800;color:var(--g4);display:flex;align-items:center;padding:0 2px}
.addr-bar{display:flex;height:42px;border-radius:var(--rs);overflow:hidden;border:2px solid var(--g2);margin:10px 0}
.addr-bar div{display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
.ab-n{background:var(--rl);color:var(--rd)}.ab-f{background:var(--grnb);color:var(--grn)}.ab-r{background:var(--blub);color:var(--blu)}.ab-l{background:var(--grnb);color:var(--grn)}.ab-b{background:var(--rl);color:var(--rd)}
.quiz-ip{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;color:var(--red);letter-spacing:1px}
.quiz-fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qf{background:var(--g0);border:2px solid var(--g2);border-radius:var(--rs);padding:10px 8px;text-align:center;transition:.3s}
.qf.correct{border-color:var(--grn);background:var(--grnb)}.qf.wrong{border-color:var(--red);background:var(--rl)}
.qf label{font-size:.58rem;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.qf input{width:100%;padding:5px;text-align:center;border:1px solid var(--g2);border-radius:var(--rxs);font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;background:var(--w);outline:none}
.qf input:focus{border-color:var(--red)}
.diff-btns{display:flex;gap:4px}
.diff-btns button{padding:4px 12px;border-radius:16px;border:2px solid var(--g2);background:var(--w);font-size:.68rem;font-weight:700;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif}
.diff-btns button.on{border-color:var(--red);background:var(--red);color:#fff}
.diff-btns button:hover:not(.on){border-color:var(--red)}
.prog-bar{height:5px;background:var(--g2);border-radius:3px;overflow:hidden;margin:6px 0}
.prog-bar div{height:100%;border-radius:3px;transition:width .5s;background:linear-gradient(90deg,var(--red),var(--grn))}
.ref-t{width:100%;border-collapse:collapse;font-size:.75rem}
.ref-t th{text-align:left;padding:6px 10px;font-size:.62rem;font-weight:700;color:var(--g5);text-transform:uppercase;background:var(--g0);border-bottom:2px solid var(--g2)}
.ref-t td{padding:5px 10px;border-bottom:1px solid var(--g1)}
.ref-t tr:hover td{background:rgba(220,38,38,.02)}
.ref-t .hl{color:var(--red);font-weight:700}
.tip-box{background:rgba(220,38,38,.03);border:1px solid var(--rl);border-radius:var(--rs);padding:10px 14px;margin:8px 0;font-size:.78rem;color:var(--g7);line-height:1.5}
.tip-box strong{color:var(--red)}
.scn-b{padding:15px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--g2);background:var(--w)}
.scn-b h3{font-size:.9rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.scn-b p{color:var(--g6);font-size:.78rem;line-height:1.5}
.ai-col{background:var(--w);border-left:1px solid var(--g2);display:flex;flex-direction:column;height:100vh}
.ai-h{padding:10px 12px;border-bottom:1px solid var(--g1);display:flex;align-items:center;gap:8px}
.ai-h .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--red),#f87171);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.55rem}
.ai-h h4{font-size:.8rem;font-weight:700}.ai-h span{font-size:.62rem;color:var(--grn);display:flex;align-items:center;gap:3px}
.ai-h span::before{content:'';width:5px;height:5px;background:var(--grn);border-radius:50%}
.ai-pg{padding:4px 12px;border-bottom:1px solid var(--g1);display:flex;align-items:center;gap:6px;font-size:.6rem;color:var(--g5)}
.ai-pg .bar{flex:1;height:3px;background:var(--g1);border-radius:2px;overflow:hidden}.ai-pg .bar div{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--red),#f87171);transition:width .5s}
.ai-sg{padding:5px 12px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--g1)}
.ai-sg button{padding:3px 8px;border:1px solid var(--g2);border-radius:14px;background:var(--w);color:var(--g6);font-size:.6rem;font-weight:500;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif}
.ai-sg button:hover{border-color:var(--red);color:var(--red)}
.ai-msgs{flex:1;overflow-y:auto;padding:10px}
.ai-m{margin-bottom:8px;display:flex;gap:6px}.ai-m.u{flex-direction:row-reverse}
.ai-m .bub{max-width:88%;padding:8px 11px;border-radius:var(--r);font-size:.72rem;line-height:1.45}
.ai-m.bot .bub{background:var(--g0);border:1px solid var(--g2);color:var(--g7);border-bottom-left-radius:2px}
.ai-m.u .bub{background:var(--red);color:#fff;border-bottom-right-radius:2px}
.ai-m .av2{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.45rem;font-weight:900;flex-shrink:0}
.ai-m.bot .av2{background:linear-gradient(135deg,var(--red),#f87171);color:#fff}
.ai-m.u .av2{background:var(--g2);color:var(--g6)}
.ai-inp{padding:8px 12px;border-top:1px solid var(--g2);display:flex;gap:5px}
.ai-inp input{flex:1;padding:6px 10px;background:var(--g0);border:1px solid var(--g2);border-radius:var(--r);color:var(--bl);font-size:.72rem;outline:none}
.ai-inp input:focus{border-color:var(--red)}
.ai-inp button{width:32px;height:32px;border-radius:var(--r);border:none;background:var(--red);color:#fff;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.modal-bg.show{display:flex}
.modal{background:var(--w);border-radius:var(--r);padding:18px;max-width:560px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid var(--g2)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side,.ai-col{display:none}.main{padding:12px}}
</style>
</head>

<script>
/* ═══ HELPERS ═══ */
function RI(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[RI(0,a.length-1)]}
function p2(n){return n<10?'0'+n:''+n}
function ip2i(ip){var p=ip.split('.');return((parseInt(p[0])<<24)|(parseInt(p[1])<<16)|(parseInt(p[2])<<8)|parseInt(p[3]))>>>0}
function i2ip(n){return((n>>>24)&255)+'.'+((n>>>16)&255)+'.'+((n>>>8)&255)+'.'+(n&255)}
function cidr2mask(c){return i2ip(~((1<<(32-c))-1)>>>0)}

/* ═══ DATA ═══ */
var SEGMENTS=[
  {name:'Engineering',vlan:100,cidr:'10.0.1.0/24',zone:'Corporate',color:'#2563eb'},
  {name:'HR',vlan:200,cidr:'10.0.2.0/24',zone:'Corporate',color:'#7c3aed'},
  {name:'Finance',vlan:300,cidr:'10.0.3.0/24',zone:'Corporate',color:'#0891b2'},
  {name:'Servers',vlan:10,cidr:'10.0.10.0/24',zone:'Infrastructure',color:'#dc2626'},
  {name:'Management',vlan:1000,cidr:'10.0.100.0/24',zone:'Management',color:'#f59e0b'},
  {name:'Guest WiFi',vlan:2000,cidr:'10.0.200.0/24',zone:'Guest',color:'#ec4899'},
  {name:'VoIP',vlan:50,cidr:'10.0.50.0/24',zone:'Voice',color:'#16a34a'},
  {name:'DMZ',vlan:10,cidr:'172.16.0.0/24',zone:'DMZ',color:'#ef4444'},
  {name:'VPN',vlan:0,cidr:'192.168.100.0/24',zone:'VPN',color:'#6366f1'}
];

var FW_RULES=[
  {id:1,src:'Engineering',dst:'Servers',action:'ALLOW',proto:'TCP',ports:'22,80,443,3306'},
  {id:2,src:'HR',dst:'Servers',action:'ALLOW',proto:'TCP',ports:'80,443'},
  {id:3,src:'Finance',dst:'Servers',action:'ALLOW',proto:'TCP',ports:'80,443'},
  {id:4,src:'Guest WiFi',dst:'ALL_INTERNAL',action:'BLOCK',proto:'ANY',ports:'ALL'},
  {id:5,src:'VoIP',dst:'VoIP',action:'ALLOW',proto:'UDP',ports:'5060'},
  {id:6,src:'VoIP',dst:'ALL_INTERNAL',action:'BLOCK',proto:'ANY',ports:'ALL'},
  {id:7,src:'Management',dst:'ALL_INTERNAL',action:'ALLOW',proto:'TCP',ports:'22,80,443,161'},
  {id:8,src:'DMZ',dst:'Servers',action:'ALLOW',proto:'TCP',ports:'80,443'},

var CIDR_REF=[];
for(var c=1;c<=32;c++){
  var tot=Math.pow(2,32-c);var use=c>=31?tot:tot-2;
  var mask=cidr2mask(c);var mag=0;var interesting=-1;var bc=0;
  for(var o=0;o<4;o++){bc+=8;if(bc>=c&&interesting===-1){interesting=o;mag=Math.pow(2,bc-c);}}

  var h='<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">'+a.name+'</h3><button class="btn btn-o btn-s" onclick="closeAM()"><i class="fas fa-times"></i></button></div>';
  h+='<div class="fg mb"><div><div class="lbl">IP</div><div class="m" style="font-size:1rem;font-weight:700;color:var(--red)">'+a.ip+'</div></div><div><div class="lbl">MAC</div><div class="m" style="font-size:.78rem;color:var(--g5)">'+a.mac+'</div></div></div>';
  h+='<div class="fg mb"><div><div class="lbl">Type</div><div><span class="tag c">'+a.type+'</span> '+a.model+'</div></div><div><div class="lbl">Status</div><div><span class="badge '+a.status+'">'+a.status.toUpperCase()+'</span></div></div></div>';
  h+='<div class="fg mb"><div><div class="lbl">Segment</div><div style="font-weight:600">'+a.seg+' <span class="m" style="font-size:.7rem;color:var(--red)">VLAN '+a.vlan+'</span></div></div><div><div class="lbl">Location</div><div>'+(a.loc||'-')+'</div></div></div>';
  if(a.ports){h+='<div class="lbl mb">Open Ports</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">';
    a.ports.forEach(function(p){h+='<span class="m" style="padding:2px 7px;background:var(--g0);border:1px solid var(--g2);border-radius:4px;font-size:.68rem">'+p+'/'+(PORTS[p]||'?')+'</span>';});h+='</div>';}
  var neighbors=ASSETS.filter(function(x){return x.seg===a.seg&&x.id!==a.id}).slice(0,5);
  h+='<div class="lbl mb">VLAN Neighbors</div><div style="display:flex;flex-wrap:wrap;gap:3px">';
  neighbors.forEach(function(n){h+='<span style="padding:2px 6px;background:var(--g0);border:1px solid var(--g2);border-radius:4px;font-size:.62rem;cursor:pointer" onclick="showAssetDetail(\''+n.id+'\')">'+n.name+' <span class="m" style="color:var(--red)">'+n.ip+'</span></span>';});h+='</div>';
  document.getElementById('assetModalBox').innerHTML=h;document.getElementById('assetModal').classList.add('show');
}

panelRenderers.nmap=function(){

  var sel=document.getElementById('nTgt');ASSETS.forEach(function(a){var o=document.createElement('option');o.value=a.id;o.textContent=a.ip+' ('+a.name+')';sel.appendChild(o);});
};
function runNmap(){var id=document.getElementById('nTgt').value,a=ASSETS.find(function(x){return x.id===id});if(!a)return;var prof=document.getElementById('nProf').value;var op=(a.ports||[80]).slice();
  if(prof==='quick')op=op.filter(function(p){return[22,80,443].indexOf(p)>=0});else if(prof==='full')op=[22,23,25,53,80,110,135,143,161,443,445,3306,3389,5432,8080];
  var t=document.getElementById('nOut');t.innerHTML='';document.getElementById('nSt').textContent='Scanning...';
  var lines=['<span style="color:#aaa">Nmap 7.94SVN scan</span>','<span style="color:#5be8a0">Nmap scan report for '+a.name+' ('+a.ip+')</span>','<span style="color:#5be8a0">Host is up ('+RI(1,50)+'ms)</span>',''];
  lines.push('<span style="color:#67e8f9">PORT      STATE    SERVICE</span>');
  op.forEach(function(p){lines.push('<span style="color:#5be8a0">'+String(p).padEnd(9)+'open     '+(PORTS[p]||'?')+'</span>');});
  lines.push('','<span style="color:#aaa">Nmap done in '+(Math.random()*10+1).toFixed(2)+'s</span>');
  var i=0;function nx(){if(i<lines.length){t.innerHTML+=lines[i]+'\n';t.scrollTop=t.scrollHeight;i++;setTimeout(nx,RI(25,90));}else document.getElementById('nSt').innerHTML='<span style="color:var(--grn)">Done</span>';}nx();}

/* Wireshark */
panelRenderers.wireshark=function(){
  document.getElementById('p-wireshark').innerHTML='<div class="card mb"><div class="ch"><h3><i class="fas fa-fish"></i> Wireshark</h3><span style="font-size:.7rem;color:var(--g5)">'+WK_PKTS.length+' packets</span></div><div class="cb"><div style="margin-bottom:6px"><input class="inp" id="wkF" placeholder="Filter: tcp, dns, http, arp, ip.addr==10.0.10.10" style="font-family:JetBrains Mono,monospace;font-size:.74rem;text-align:left" onkeydown="if(event.key===\'Enter\')wkFilter()"></div><div style="max-height:240px;overflow-y:auto;border:1px solid var(--g2);border-radius:var(--rxs)"><table><thead><tr><th>#</th><th>Time</th><th>Source</th><th>Dest</th><th>Proto</th><th>Len</th><th>Info</th></tr></thead><tbody id="tbWK"></tbody></table></div></div></div><div class="card"><div class="ch"><h3>Protocol Stats</h3></div><div class="cb"><div class="cht h140"><canvas id="cWK"></canvas></div></div></div>';
  wkRender(WK_PKTS);var protos={};WK_PKTS.forEach(function(p){protos[p.proto]=(protos[p.proto]||0)+1});var pL=Object.keys(protos);
  new Chart(document.getElementById('cWK'),{type:'doughnut',data:{labels:pL,datasets:[{data:pL.map(function(k){return protos[k]}),backgroundColor:['#2563eb','#0891b2','#d97706','#16a34a','#ec4899'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',padding:4,font:{size:8}}}}}});
};
function wkRender(pkts){var h='';pkts.forEach(function(p){h+='<tr><td class="m">'+p.no+'</td><td class="m">'+p.time+'</td><td class="m" style="font-size:.66rem">'+p.src+'</td><td class="m" style="font-size:.66rem">'+p.dst+'</td><td><span class="tag '+(p.proto==='TCP'?'b':p.proto==='UDP'||p.proto==='DNS'?'c':p.proto==='HTTP'?'g':'a')+'">'+p.proto+'</span></td><td class="m">'+p.len+'</td><td style="font-size:.64rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.info+'</td></tr>';});document.getElementById('tbWK').innerHTML=h;}
function wkFilter(){var f=document.getElementById('wkF').value.trim().toLowerCase();if(!f){wkRender(WK_PKTS);return;}var fl=WK_PKTS.filter(function(p){if(f==='tcp')return p.proto==='TCP';if(f==='dns')return p.proto==='DNS';if(f==='http')return p.proto==='HTTP';if(f==='arp')return p.proto==='ARP';if(f.indexOf('ip.addr==')>=0){var ip=f.split('==')[1].trim();return p.src.indexOf(ip)>=0||p.dst.indexOf(ip)>=0;}return p.proto.toLowerCase().indexOf(f)>=0;});wkRender(fl);}

/* Calculator */
panelRenderers.calc=function(){
  document.getElementById('p-calc').innerHTML='<div class="g2 mb"><div class="card"><div class="ch"><h3><i class="fas fa-calculator"></i> CIDR Calculator</h3></div><div class="cb"><div class="fg"><div><label class="lbl">IP</label><input class="inp" id="cIP" value="10.0.1.0"></div><div><label class="lbl">CIDR</label><select class="inp" id="cCIDR" onchange="doCalc()"></select></div></div><button class="btn btn-r" onclick="doCalc()">Calculate</button><div id="cRes" style="margin-top:10px"></div></div></div><div class="card"><div class="ch"><h3>Subnet Splitter</h3></div><div class="cb"><div class="fg"><div><label class="lbl">Network</label><input class="inp" id="sNet" value="10.0.0.0/16"></div><div><label class="lbl">Subnets</label><select class="inp" id="sN"><option>2</option><option>4</option><option selected>8</option><option>16</option><option>32</option></select></div></div><button class="btn btn-r" onclick="doSplit()">Split</button><div id="sRes" style="margin-top:10px;max-height:240px;overflow-y:auto"></div></div></div></div>';
  var sel=document.getElementById('cCIDR');for(var c=1;c<=32;c++){var o=document.createElement('option');o.value=c;o.textContent='/'+c;if(c===24)o.selected=true;sel.appendChild(o);}
  doCalc();doSplit();
};
function doCalc(){var ip=document.getElementById('cIP').value.trim(),c=parseInt(document.getElementById('cCIDR').value);if(!ip)return;var ipI=ip2i(ip),mI=(~((1<<(32-c))-1))>>>0,nI=(ipI&mI)>>>0,bI=(nI|(~mI>>>0))>>>0,tot=Math.pow(2,32-c),use=Math.max(0,tot-2);
  var rows=[['IP',ip+'/'+c],['Mask',cidr2mask(c)],['Network',i2ip(nI)],['First',i2ip(nI+1)],['Last',i2ip(bI-1)],['Broadcast',i2ip(bI)],['Total',tot.toLocaleString()],['Usable',use.toLocaleString()]];var h='';rows.forEach(function(r){h+='<div style="display:flex;justify-content:space-between;padding:4px 8px;background:var(--g0);border:1px solid var(--g1);border-radius:var(--rxs);font-size:.74rem;margin-bottom:3px"><span style="color:var(--g5)">'+r[0]+'</span><span class="m" style="font-weight:600">'+r[1]+'</span></div>';});
  h+='<div style="display:flex;height:24px;border-radius:var(--rxs);overflow:hidden;gap:2px;margin-top:8px"><div style="flex:'+c+';background:var(--red);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff">'+c+' net</div><div style="flex:'+Math.max(32-c,1)+';background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:var(--g7)">'+(32-c)+' host</div></div>';
  document.getElementById('cRes').innerHTML=h;}
function doSplit(){var ns=document.getElementById('sNet').value.trim(),n=parseInt(document.getElementById('sN').value),pts=ns.split('/');if(pts.length!==2)return;var ipI=ip2i(pts[0]),orig=parseInt(pts[1]),bits=Math.ceil(Math.log(n)/Math.log(2)),nc=orig+bits;if(nc>30)return;var sz=Math.pow(2,32-nc),maskI=(~((1<<(32-nc))-1))>>>0,base=(ipI&(~((1<<(32-orig))-1)))>>>0,act=Math.min(n,Math.pow(2,bits));var h='<table><thead><tr><th>#</th><th>Network</th><th>Range</th><th>Bcast</th><th>Hosts</th></tr></thead><tbody>';for(var i=0;i<act;i++){var sn=(base+i*sz)>>>0,bc=(sn|(~maskI>>>0))>>>0;h+='<tr><td class="m" style="color:var(--red);font-weight:700">'+(i+1)+'</td><td class="m" style="font-size:.7rem">'+i2ip(sn)+'/'+nc+'</td><td class="m" style="font-size:.7rem;color:var(--grn)">'+i2ip(sn+1)+'-'+i2ip(bc-1)+'</td><td class="m" style="font-size:.7rem;color:var(--red)">'+i2ip(bc)+'</td><td class="m">'+(sz-2)+'</td></tr>';}h+='</tbody></table>';document.getElementById('sRes').innerHTML=h;}

function demoCalc(){
  var ip=document.getElementById('demoIP').value.trim();var c=parseInt(document.getElementById('demoCIDR').value);
  if(!ip||ip.split('.').length!==4||isNaN(c)||c<1||c>31)return;
  var parts=ip.split('.').map(Number);var interesting=-1;var bitCount=0;
  for(var o=0;o<4;o++){if(bitCount>=c)break;var b=Math.min(8,c-bitCount);if(b<8)interesting=o;bitCount+=b;}
  if(interesting===-1)interesting=3;
  var maskParts=cidr2mask(c).split('.').map(Number);var magicVal=256-maskParts[interesting];if(c%8===0)magicVal=0;
  var ipI=ip2i(ip),maskI=(~((1<<(32-c))-1))>>>0,netI=(ipI&maskI)>>>0,bcastI=(netI|(~maskI>>>0))>>>0,firstI=(netI+1)>>>0,lastI=(bcastI-1)>>>0;
  var tot=Math.pow(2,32-c),use=Math.max(0,tot-2);
  var cls=parts[0]>=1&&parts[0]<=126?'A':parts[0]>=128&&parts[0]<=191?'B':parts[0]>=192&&parts[0]<=223?'C':'D/E';
  var h='<div class="step done"><div class="sn">1</div><h4>Class '+parts[0]+' -> '+cls+'</h4></div>';
  h+='<div class="step done"><div class="sn">2</div><h4>Magic Number: '+(magicVal>0?'256 - '+maskParts[interesting]+' = '+magicVal:'Default /'+c)+'</h4></div>';
  h+='<div class="step done"><div class="sn">3</div><h4>5 Key Values</h4><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px">';
  h+='<div style="border:2px solid var(--red);padding:8px;border-radius:var(--rs);text-align:center"><div style="font-size:.56rem;font-weight:700;color:var(--red)">NETWORK</div><div class="m" style="font-size:.82rem;font-weight:700;margin-top:3px">'+i2ip(netI)+'</div></div>';
  h+='<div style="border:2px solid var(--grn);padding:8px;border-radius:var(--rs);text-align:center"><div style="font-size:.56rem;font-weight:700;color:var(--grn)">1ST HOST</div><div class="m" style="font-size:.82rem;font-weight:700;margin-top:3px">'+i2ip(firstI)+'</div></div>';
  h+='<div style="border:2px solid var(--blu);padding:8px;border-radius:var(--rs);text-align:center"><div style="font-size:.56rem;font-weight:700;color:var(--blu)">BROADCAST</div><div class="m" style="font-size:.82rem;font-weight:700;margin-top:3px">'+i2ip(bcastI)+'</div></div>';
  h+='<div style="border:2px solid var(--grn);padding:8px;border-radius:var(--rs);text-align:center"><div style="font-size:.56rem;font-weight:700;color:var(--grn)">LAST HOST</div><div class="m" style="font-size:.82rem;font-weight:700;margin-top:3px">'+i2ip(lastI)+'</div></div>';
  h+='<div style="border:2px solid var(--pur);padding:8px;border-radius:var(--rs);text-align:center"><div style="font-size:.56rem;font-weight:700;color:var(--pur)">HOSTS</div><div class="m" style="font-size:.82rem;font-weight:700;margin-top:3px">'+use.toLocaleString()+'</div></div></div></div>';
  document.getElementById('demoResult').innerHTML=h;}

function showBinary(){var ip=document.getElementById('binIP').value.trim();var c=parseInt(document.getElementById('binCIDR').value);if(!ip||ip.split('.').length!==4||isNaN(c)||c<1||c>31)return;var parts=ip.split('.').map(Number);
  var h='<div class="binary-row">';var bi=0;
  for(var o=0;o<4;o++){var bits=parts[o].toString(2).padStart(8,'0');h+='<div class="octet"><div class="bits">';for(var b=0;b<8;b++){var cls=bi<c?'nb':'hb';if(bi===c-1&&c%8!==0)cls='mb';h+='<div class="'+cls+'">'+bits[b]+'</div>';bi++;}h+='</div><div class="dec">('+parts[o]+')</div></div>';if(o<3)h+='<div class="ds">.</div>';}
  h+='</div><div style="display:flex;gap:14px;margin-top:6px;font-size:.68rem"><div style="display:flex;align-items:center;gap:3px"><span style="width:12px;height:12px;background:var(--rl);border:1px solid var(--red);border-radius:2px;display:inline-block"></span> Network ('+c+')</div><div style="display:flex;align-items:center;gap:3px"><span style="width:12px;height:12px;background:var(--g0);border:1px solid var(--g2);border-radius:2px;display:inline-block"></span> Host ('+(32-c)+')</div><div style="display:flex;align-items:center;gap:3px"><span style="width:12px;height:12px;background:rgba(220,38,38,.15);border:2px solid var(--red);border-radius:2px;display:inline-block"></span> Magic bit</div></div>';

function genIP2(d){if(d==='easy')return pick([10,172,192])+'.'+pick([0,1,2,5,10,50])+'.'+pick([0,1,2,5,10])+'.'+RI(1,250);if(d==='medium')return pick([10,172,192,203])+'.'+RI(0,255)+'.'+RI(0,255)+'.'+RI(1,250);return RI(1,223)+'.'+RI(0,255)+'.'+RI(0,255)+'.'+RI(1,250);}
function genCIDR2(d){if(d==='easy')return pick([24,25,26,27,28]);if(d==='medium')return pick([22,23,24,25,26,27,28,29,30]);return pick([8,12,16,20,22,24,25,26,27,28,29,30]);}
function calcAns(ip,c){var ipI=ip2i(ip),mI=(~((1<<(32-c))-1))>>>0,nI=(ipI&mI)>>>0,bI=(nI|(~mI>>>0))>>>0;return{network:i2ip(nI),first:i2ip(nI+1),broadcast:i2ip(bI),last:i2ip(bI-1),hosts:Math.pow(2,32-c)-2};}

function checkL1(){var score=0,fb=[];var req=[{n:'Engineering',h:80},{n:'HR',h:30},{n:'Finance',h:20},{n:'Servers',h:15},{n:'Guest',h:100}];var expV=[100,200,300,10,2000];

    else{fb.push(req[i].n+': no CIDR');}}

  if(act==='BLOCK'&&dst==='ALL_INTERNAL')score+=10;else fb.push('Firewall: should BLOCK Guest->ALL_INTERNAL');

  var h='<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--g0);border:2px solid var(--g2);border-radius:var(--r)"><div class="m" style="font-size:2rem;font-weight:900;color:'+color+'">'+score+'</div><div><div style="font-weight:700">/100</div></div></div>';
  if(fb.length){h+='<div style="margin-top:10px;padding:10px;background:rgba(220,38,38,.04);border:1px solid var(--rl);border-radius:var(--rs)"><div style="font-weight:700;color:var(--red);margin-bottom:4px;font-size:.78rem">Feedback</div>';fb.forEach(function(f){h+='<div style="font-size:.72rem;color:var(--g6)">- '+f+'</div>';});h+='</div>';}
  h+='<div style="margin-top:10px;padding:10px;background:rgba(22,163,74,.04);border:1px solid var(--grnb);border-radius:var(--rs)"><div style="font-weight:700;color:var(--grn);margin-bottom:4px;font-size:.78rem">Reference</div><div style="font-size:.72rem;color:var(--g6)">Eng: /25 (126h), HR: /27 (30h), Fin: /27 (30h), Srv: /28 (14h), Guest: /25 (126h)</div></div>';
  document.getElementById('lab1R').innerHTML=h;}

panelRenderers.lab2=function(){
  document.getElementById('p-lab2').innerHTML='<div class="scn-b" style="border-left:4px solid var(--pur)"><h3><i class="fas fa-flask" style="color:var(--pur)"></i> Lab: Zero Trust Firewall Rules</h3><p>Configure 6 firewall rules for zero-trust segmentation.</p></div><div class="card mb"><div class="ch"><h3>Reference Rules</h3></div><div class="cb"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.72rem;color:var(--g6)"><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">1. Eng->Srv: ALLOW TCP 22,80,443</div><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">2. HR->Srv: ALLOW TCP 80,443</div><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">3. VoIP->VoIP: ALLOW UDP 5060</div><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">4. Guest->ALL: BLOCK</div><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">5. Mgmt->ALL: ALLOW 22,80,443</div><div style="background:var(--g0);padding:8px;border-radius:var(--rs)">6. Eng->HR: BLOCK</div></div></div></div><div class="card mb"><div class="ch"><h3>Configure</h3></div><div class="cb" id="lab2F"></div></div><div class="card"><div class="ch"><h3>Score</h3><button class="btn btn-r" onclick="checkL2()"><i class="fas fa-check"></i> Submit</button></div><div class="cb" id="lab2R"><div style="text-align:center;padding:16px;color:var(--g4)">Configure and submit</div></div></div>';
  var segOpts='';SEGMENTS.forEach(function(s){segOpts+='<option value="'+s.name+'">'+s.name+'</option>';});segOpts+='<option value="ALL_INTERNAL">ALL_INTERNAL</option>';
  var fh='';for(var i=0;i<6;i++){fh+='<div style="background:var(--g0);border:1px solid var(--g2);border-radius:var(--rs);padding:8px;margin-bottom:6px"><div style="font-size:.68rem;font-weight:700;margin-bottom:4px">Rule '+(i+1)+'</div><div class="fg"><div><select class="inp" id="l2s'+i+'">'+segOpts+'</select></div><div><select class="inp" id="l2d'+i+'">'+segOpts+'</select></div></div><div class="fg"><div><select class="inp" id="l2a'+i+'"><option value="ALLOW">ALLOW</option><option value="BLOCK">BLOCK</option></select></div><div><input class="inp" id="l2p'+i+'" placeholder="ports (e.g. 22,80,443)"></div></div></div>';}
  document.getElementById('lab2F').innerHTML=fh;
};
function checkL2(){var expected=[{s:'Engineering',d:'Servers',a:'ALLOW',p:'22,80,443'},{s:'HR',d:'Servers',a:'ALLOW',p:'80,443'},{s:'VoIP',d:'VoIP',a:'ALLOW',p:'5060'},{s:'Guest WiFi',d:'ALL_INTERNAL',a:'BLOCK'},{s:'Management',d:'ALL_INTERNAL',a:'ALLOW',p:'22,80,443'},{s:'Engineering',d:'HR',a:'BLOCK'}];
  var score=0,fb=[];for(var i=0;i<6;i++){var s=document.getElementById('l2s'+i).value;var d=document.getElementById('l2d'+i).value;var a=document.getElementById('l2a'+i).value;var p=document.getElementById('l2p'+i).value.trim();var e=expected[i];
    if(s===e.s)score+=5;else fb.push('Rule '+(i+1)+': wrong source');if(d===e.d)score+=5;else fb.push('Rule '+(i+1)+': wrong dest');if(a===e.a)score+=5;else fb.push('Rule '+(i+1)+': wrong action');if(e.p&&p===e.p)score+=2;else if(e.p)fb.push('Rule '+(i+1)+': wrong ports');else score+=2;}
  score=Math.min(100,score);var color=score>=80?'var(--grn)':score>=60?'var(--amb)':'var(--red)';
  var h='<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--g0);border:2px solid var(--g2);border-radius:var(--r)"><div class="m" style="font-size:2rem;font-weight:900;color:'+color+'">'+score+'</div><div><div style="font-weight:700">/100</div></div></div>';
  if(fb.length){h+='<div style="margin-top:8px;padding:8px;background:rgba(220,38,38,.04);border:1px solid var(--rl);border-radius:var(--rs)"><div style="font-weight:700;color:var(--red);margin-bottom:3px;font-size:.76rem">Feedback</div>';fb.forEach(function(f){h+='<div style="font-size:.7rem;color:var(--g6)">- '+f+'</div>';});h+='</div>';}
  document.getElementById('lab2R').innerHTML=h;}

/* ═══ AI PANEL ═══ */
var aiChat=[];
function aiGuide(p){
  var msgs={dashboard:'Dashboard overview: '+SEGMENTS.length+' segments, '+ASSETS.length+' assets, '+SIEM_EVTS.filter(function(e){return e.sev==='critical'}).length+' critical alerts.',
  subnets:'IP Space by zone.',seg:'Topology + flow matrix. Click segments.',vlans:'VLAN configuration.',fwrules:FW_RULES.length+' firewall rules.',assets:ASSETS.length+' assets. Click for details.',
  topo:'Interactive topology.',siem:SIEM_EVTS.length+' events. Filter by severity.',edr:'EDR endpoint monitoring.',nmap:'Scan any asset.',wireshark:WK_PKTS.length+' packets.',
  learn:'Subnetting: Class ID, Magic Number, 5 Values, Binary.',practice:'Practice Easy/Medium/Hard.',quiz:'60-second timed quiz.',cidr:'Complete /1-/32 reference.',
  calc:'CIDR calculator + splitter.',lab1:'Segmentation lab (100pts).',lab2:'Zero Trust lab (100pts).'};
  if(msgs[p])aiMsg(msgs[p]);
  renderSugs(['Assets','VLANs','Nmap','CIDR /1-/32','Magic Number','Lab tips','Zero trust','Best practices']);
}
function aiMsg(t){aiChat.push({r:'bot',t:t});renderChat();}
function renderChat(){var el=document.getElementById('aiMsgs'),h='';aiChat.forEach(function(m){h+='<div class="ai-m '+m.r+'"><div class="av2">'+(m.r==='bot'?'AI':'U')+'</div><div class="bub">'+m.t+'</div></div>';});el.innerHTML=h;el.scrollTop=el.scrollHeight;}
function renderSugs(arr){var el=document.getElementById('aiSug');el.innerHTML='';if(!arr)return;arr.forEach(function(s){var b=document.createElement('button');b.textContent=s;b.onclick=function(){askAI(s)};el.appendChild(b);});}
function askAI(q){aiChat.push({r:'user',t:q});renderChat();setTimeout(function(){aiMsg(genReply(q));},400);}
function sendAI(){var inp=document.getElementById('aiIn'),q=inp.value.trim();if(!q)return;inp.value='';askAI(q);}
function genReply(q){q=q.toLowerCase();
  if(q.indexOf('asset')>=0)return 'Click any asset for IP, MAC, ports, segment, VLAN neighbors, and actions (isolate, scan, move). '+ASSETS.length+' total.';
  if(q.indexOf('vlan')>=0)return 'VLANs create isolated broadcast domains. '+SEGMENTS.length+' VLANs configured. Each maps to one subnet.';
  if(q.indexOf('nmap')>=0)return 'Nmap scans: Quick (top ports), Standard (version), Service (NSE scripts), Full (all 65535).';
  if(q.indexOf('cidr')>=0)return 'The /1-/32 reference covers all 32 CIDR values. /1=2B IPs, /24=254 hosts, /32=host route.';
  if(q.indexOf('magic')>=0)return 'Magic Number = 256 - mask value in interesting octet. /25=128, /26=64, /27=32, /28=16, /29=8, /30=4.';
  if(q.indexOf('lab')>=0)return 'Lab 1: Design subnets for 5 depts. Lab 2: Configure 6 zero-trust rules. Both scored out of 100.';
  if(q.indexOf('zero trust')>=0)return 'Zero Trust: never trust, always verify. Every segment isolated. Only explicit rules allow traffic.';
  if(q.indexOf('best')>=0||q.indexOf('tip')>=0)return 'Tips: 1) One VLAN per dept. 2) Default deny. 3) IoT/Guest isolated. 4) 30% headroom. 5) Practice daily.';
  if(q.indexOf('hello')>=0||q.indexOf('hi')>=0)return 'Hey! Ask about segmentation, VLANs, CIDR, Nmap, labs, or anything network related!';
  if(q.indexOf('siem')>=0)return 'SIEM correlates from firewalls, EDR, DNS. '+SIEM_EVTS.filter(function(e){return e.sev==='critical'}).length+' critical alerts active.';
  return 'Try asking about: assets, VLANs, Nmap, CIDR /1-/32, magic number, zero trust, lab tips, or best practices.';
}

renderSugs(['Assets','VLANs','Nmap','CIDR /1-/32','Magic Number','Lab tips','Zero trust','Best practices']);
