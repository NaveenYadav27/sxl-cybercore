<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowXLab · SXL-Network — CyberCore Modular IPAM, SOC & Range Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0f16;--w:#131a24;--panel:#17202d;--line:#243042;
  --red:#f04438;--rl:rgba(240,68,56,0.15);--rd:#b80f15;--rh:#ff3b42;
  --bl:#e6e9ef;--g7:#cbd5e1;--g6:#94a3b8;--g5:#64748b;--g4:#475569;--g3:#334155;--g2:#1e293b;--g1:#0f172a;--g0:#0b0f17;
  --grn:#10b981;--grnb:rgba(16,185,129,0.15);--amb:#fbbf24;--ambb:rgba(251,191,36,0.15);
  --blu:#38bdf8;--blub:rgba(56,189,248,0.15);--pur:#a855f7;--purb:rgba(168,85,247,0.15);
  --cyn:#2dd4bf;--cynb:rgba(45,212,191,0.15);--pnk:#f472b6;--pnkb:rgba(244,114,182,0.15);
  --r:12px;--rs:8px;--rxs:6px;--sh:0 8px 24px rgba(0,0,0,0.4);
  --mono:'JetBrains Mono','IBM Plex Mono',monospace;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--bl);overflow:hidden;height:100vh}
.m{font-family:var(--mono)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--g3);border-radius:3px}
.app{display:grid;grid-template-columns:230px 1fr 300px;height:100vh}
.side{background:var(--w);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.logo{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;background:var(--g0)}
.logo-badge{background:#04070c;padding:3px 6px;border-radius:8px;border:1px solid #1a2332;display:flex;align-items:center}
.logo-badge img{height:32px;width:auto;object-fit:contain;display:block}
.logo-text b{font-size:.82rem;font-weight:900;letter-spacing:.04em;display:block;color:var(--bl)}
.logo-text b span{color:var(--red)}
.logo-text small{font-size:.5rem;font-family:var(--mono);color:var(--g5);letter-spacing:.08em;display:block;margin-top:1px}
.nav{flex:1;padding:6px 0}
.ng{font-size:.54rem;font-weight:800;color:var(--g5);text-transform:uppercase;letter-spacing:.1em;padding:10px 14px 3px;font-family:var(--mono)}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:6px 14px;background:none;border:none;color:var(--g6);font-size:.73rem;font-weight:500;cursor:pointer;border-left:3px solid transparent;text-align:left;font-family:'Inter',sans-serif;transition:all .15s}
.nb:hover{color:var(--bl);background:var(--panel)}.nb.on{color:var(--red);background:rgba(240,68,56,.08);border-left-color:var(--red);font-weight:700}
.nb i{width:15px;text-align:center;font-size:.75rem}
.nb .mod-tag{font-size:.52rem;padding:1px 5px;border-radius:4px;background:var(--g2);color:var(--g6);margin-left:auto;font-family:var(--mono)}
.main{overflow-y:auto;padding:16px 20px;background:var(--bg)}
.pnl{display:none}.pnl.on{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;background:var(--w);padding:10px 16px;border-radius:var(--rs);border:1px solid var(--line);box-shadow:var(--sh)}
.topbar .title{font-size:.76rem;font-weight:800;color:var(--g7);font-family:var(--mono);display:flex;align-items:center;gap:8px}
.topbar .title span{color:var(--red)}
.card{background:var(--w);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
.ch h3{font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:7px}.ch h3 i{color:var(--red)}
.cb{padding:14px 15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mb{margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--w);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.st::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:0 3px 3px 0}
.st.red::before{background:var(--red)}.st.grn::before{background:var(--grn)}.st.blu::before{background:var(--blu)}.st.pur::before{background:var(--pur)}.st.amb::before{background:var(--amb)}
.st .sl{font-size:.6rem;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.st .sv{font-size:1.25rem;font-weight:800;margin-top:3px;font-family:var(--mono);color:var(--bl)}
.st .si{position:absolute;top:10px;right:12px;font-size:1.4rem;opacity:.12}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 10px;font-size:.62rem;font-weight:800;color:var(--g5);text-transform:uppercase;letter-spacing:.05em;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);color:var(--g7)}
tr:hover td{background:rgba(240,68,56,.04)}
.badge{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:.6rem;font-weight:700;font-family:var(--mono)}
.badge.up{color:var(--grn);background:var(--grnb)}.badge.dn{color:var(--red);background:var(--rl)}.badge.idle{color:var(--amb);background:var(--ambb)}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.58rem;font-weight:700;font-family:var(--mono)}
.tag.r{color:var(--red);background:var(--rl)}.tag.b{color:var(--blu);background:var(--blub)}.tag.p{color:var(--pur);background:var(--purb)}.tag.c{color:var(--cyn);background:var(--cynb)}.tag.g{color:var(--grn);background:var(--grnb)}.tag.a{color:var(--amb);background:var(--ambb)}
.btn{padding:6px 13px;border-radius:var(--rxs);border:1px solid var(--line);background:var(--panel);color:var(--bl);font-weight:700;font-size:.72rem;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--red);color:var(--red)}.btn:active{transform:scale(.97)}
.btn-r{background:linear-gradient(135deg,var(--red),var(--rd));color:#fff;border-color:var(--red);box-shadow:0 4px 14px rgba(240,68,56,.3)}
.btn-r:hover{background:linear-gradient(135deg,#ff4d40,#c91218);color:#fff}
.btn-s{padding:4px 10px;font-size:.66rem}.btn-lg{padding:9px 20px;font-size:.8rem;border-radius:var(--rs)}
.inp{width:100%;padding:6px 10px;background:var(--g0);border:1px solid var(--line);border-radius:var(--rxs);color:var(--bl);font-size:.78rem;outline:none;transition:.2s;font-family:'Inter',sans-serif;text-align:center;font-weight:600}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(240,68,56,.15)}
.lbl{font-size:.6rem;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;display:block;text-align:center;font-family:var(--mono)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cht{position:relative}.cht.h200{height:200px}.cht.h160{height:160px}.cht.h140{height:140px}
.term{background:#04070c;color:#10b981;font-family:var(--mono);font-size:.7rem;padding:12px;border-radius:var(--rs);border:1px solid var(--line);max-height:380px;overflow-y:auto;line-height:1.55;white-space:pre-wrap}
.formula{font-family:var(--mono);font-size:.82rem;background:var(--g0);border:1px solid var(--line);padding:8px 12px;border-radius:var(--rs);margin:6px 0;color:var(--red);font-weight:700}
.binary-row{display:flex;gap:0;margin:6px 0;font-family:var(--mono)}
.binary-row .octet{display:flex;flex-direction:column;align-items:center;min-width:58px}
.binary-row .octet .bits{display:flex;gap:1px}
.binary-row .octet .bit{width:14px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;border:1px solid var(--line);background:var(--g0);transition:.2s}
.binary-row .octet .bit.nb{background:var(--rl);border-color:var(--red);color:var(--red)}
.binary-row .octet .bit.hb{background:var(--panel);color:var(--g5)}
.binary-row .octet .bit.mb{background:rgba(240,68,56,.3);border-color:var(--red);color:#fff;font-weight:900}
.binary-row .octet .dec{font-size:.72rem;font-weight:800;margin-top:3px;color:var(--g6)}
.binary-row .ds{font-size:1.1rem;font-weight:800;color:var(--g4);display:flex;align-items:center;padding:0 2px}
.quiz-ip{font-family:var(--mono);font-size:1.5rem;font-weight:800;color:var(--red);letter-spacing:1px}
.quiz-fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qf{background:var(--g0);border:2px solid var(--line);border-radius:var(--rs);padding:10px 8px;text-align:center;transition:.3s}
.qf.correct{border-color:var(--grn);background:var(--grnb)}.qf.wrong{border-color:var(--red);background:var(--rl)}
.qf label{font-size:.58rem;font-weight:800;color:var(--g5);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;font-family:var(--mono)}
.qf input{width:100%;padding:5px;text-align:center;border:1px solid var(--line);border-radius:var(--rxs);font-family:var(--mono);font-size:.76rem;font-weight:700;background:var(--panel);color:var(--bl);outline:none}
.qf input:focus{border-color:var(--red)}
.diff-btns{display:flex;gap:4px}
.diff-btns button{padding:4px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--g6);font-size:.68rem;font-weight:700;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif}
.diff-btns button.on{border-color:var(--red);background:var(--red);color:#fff}
.prog-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.prog-bar div{height:100%;border-radius:3px;transition:width .5s;background:linear-gradient(90deg,var(--red),var(--grn))}
.ref-t{width:100%;border-collapse:collapse;font-size:.75rem}
.ref-t th{text-align:left;padding:6px 10px;font-size:.62rem;font-weight:800;color:var(--g5);text-transform:uppercase;background:var(--panel);border-bottom:2px solid var(--line)}
.ref-t td{padding:6px 10px;border-bottom:1px solid var(--line)}
.ref-t tr:hover td{background:rgba(240,68,56,.04)}
.ref-t .hl{color:var(--red);font-weight:700}
.scn-b{padding:14px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--line);background:var(--panel)}
.scn-b h3{font-size:.88rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.scn-b p{color:var(--g6);font-size:.76rem;line-height:1.5}
.ai-col{background:var(--w);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
.ai-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--g0)}
.ai-h .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--red),#f87171);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.6rem;font-family:var(--mono)}
.ai-h h4{font-size:.8rem;font-weight:800}.ai-h span{font-size:.62rem;color:var(--grn);display:flex;align-items:center;gap:4px;font-family:var(--mono)}
.ai-h span::before{content:'';width:6px;height:6px;background:var(--grn);border-radius:50%}
.ai-pg{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:.62rem;color:var(--g5);font-family:var(--mono)}
.ai-pg .bar{flex:1;height:4px;background:var(--g0);border-radius:2px;overflow:hidden}.ai-pg .bar div{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--red),#f87171);transition:width .5s}
.ai-sg{padding:6px 12px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.ai-sg button{padding:3px 8px;border:1px solid var(--line);border-radius:14px;background:var(--w);color:var(--g6);font-size:.6rem;font-weight:600;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif}
.ai-sg button:hover{border-color:var(--red);color:var(--red)}
.ai-msgs{flex:1;overflow-y:auto;padding:12px}
.ai-m{margin-bottom:10px;display:flex;gap:7px}.ai-m.u{flex-direction:row-reverse}
.ai-m .bub{max-width:86%;padding:8px 11px;border-radius:var(--r);font-size:.72rem;line-height:1.45}
.ai-m.bot .bub{background:var(--panel);border:1px solid var(--line);color:var(--g7);border-bottom-left-radius:2px}
.ai-m.u .bub{background:var(--red);color:#fff;border-bottom-right-radius:2px;font-weight:500}
.ai-m .av2{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:900;flex-shrink:0;font-family:var(--mono)}
.ai-m.bot .av2{background:linear-gradient(135deg,var(--red),#f87171);color:#fff}
.ai-m.u .av2{background:var(--g3);color:var(--g6)}
.ai-inp{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;background:var(--g0)}
.ai-inp input{flex:1;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--bl);font-size:.72rem;outline:none}
.ai-inp input:focus{border-color:var(--red)}
.ai-inp button{width:34px;height:34px;border-radius:var(--r);border:none;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px)}.modal-bg.show{display:flex}
.modal{background:var(--w);border-radius:var(--r);padding:18px;max-width:580px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);border:1px solid var(--line)}
.mod-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.mod-card:hover{border-color:var(--red);background:rgba(240,68,56,.04)}
@media(max-width:960px){.app{grid-template-columns:1fr}.side,.ai-col{display:none}.main{padding:12px}}
</style>
</head>

}

function runNmap(){var id=document.getElementById('nTgt').value,a=ASSETS.find(function(x){return x.id===id});if(!a)return;var prof=document.getElementById('nProf').value;var op=(a.ports||[80]).slice();

function wkRender(pkts){var h='';pkts.forEach(function(p){h+='<tr><td class="m">'+p.no+'</td><td class="m" style="color:var(--g6)">'+p.time+'</td><td class="m" style="font-size:.66rem;color:var(--blu)">'+p.src+'</td><td class="m" style="font-size:.66rem;color:var(--pur)">'+p.dst+'</td><td><span class="tag '+(p.proto==='TCP'?'b':p.proto==='UDP'||p.proto==='DNS'?'c':p.proto==='HTTP'?'g':'a')+'">'+p.proto+'</span></td><td class="m">'+p.len+'</td><td style="font-size:.66rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g7)">'+p.info+'</td></tr>';});document.getElementById('tbWK').innerHTML=h;}

  doCalc();doSplit();
};
function doCalc(){var ip=document.getElementById('cIP').value.trim(),c=parseInt(document.getElementById('cCIDR').value);if(!ip)return;var ipI=ip2i(ip),mI=(~((1<<(32-c))-1))>>>0,nI=(ipI&mI)>>>0,bI=(nI|(~mI>>>0))>>>0,tot=Math.pow(2,32-c),use=Math.max(0,tot-2);
  var rows=[['CIDR Notation',ip+'/'+c],['Subnet Mask',cidr2mask(c)],['Network Address',i2ip(nI)],['First Usable Host',i2ip(nI+1)],['Last Usable Host',i2ip(bI-1)],['Broadcast Address',i2ip(bI)],['Total Address Space',tot.toLocaleString()],['Usable Host Capacity',use.toLocaleString()]];var h='';rows.forEach(function(r){h+='<div style="display:flex;justify-content:space-between;padding:5px 8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rxs);font-size:.74rem;margin-bottom:3px"><span style="color:var(--g5)">'+r[0]+'</span><span class="m" style="font-weight:700;color:var(--bl)">'+r[1]+'</span></div>';});
  h+='<div style="display:flex;height:24px;border-radius:var(--rxs);overflow:hidden;gap:2px;margin-top:8px"><div style="flex:'+c+';background:var(--red);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:#fff;font-family:var(--mono)">'+c+' NET BITS</div><div style="flex:'+Math.max(32-c,1)+';background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:var(--g7);font-family:var(--mono)">'+(32-c)+' HOST BITS</div></div>';
  document.getElementById('cRes').innerHTML=h;}
function doSplit(){var ns=document.getElementById('sNet').value.trim(),n=parseInt(document.getElementById('sN').value),pts=ns.split('/');if(pts.length!==2)return;var ipI=ip2i(pts[0]),orig=parseInt(pts[1]),bits=Math.ceil(Math.log(n)/Math.log(2)),nc=orig+bits;if(nc>30)return;var sz=Math.pow(2,32-nc),maskI=(~((1<<(32-nc))-1))>>>0,base=(ipI&(~((1<<(32-orig))-1)))>>>0,act=Math.min(n,Math.pow(2,bits));var h='<table><thead><tr><th>#</th><th>Subnet CIDR</th><th>Host Range</th><th>Broadcast</th><th>Usable</th></tr></thead><tbody>';for(var i=0;i<act;i++){var sn=(base+i*sz)>>>0,bc=(sn|(~maskI>>>0))>>>0;h+='<tr><td class="m" style="color:var(--red);font-weight:800">'+(i+1)+'</td><td class="m" style="font-size:.7rem;color:var(--blu)">'+i2ip(sn)+'/'+nc+'</td><td class="m" style="font-size:.7rem;color:var(--grn)">'+i2ip(sn+1)+'-'+i2ip(bc-1)+'</td><td class="m" style="font-size:.7rem;color:var(--red)">'+i2ip(bc)+'</td><td class="m">'+(sz-2)+'</td></tr>';}h+='</tbody></table>';document.getElementById('sRes').innerHTML=h;}

function testClass(){var ip=document.getElementById('classTest').value.trim();var el=document.getElementById('classResult');if(!ip||ip.split('.').length!==4){el.innerHTML='';return;}var first=parseInt(ip.split('.')[0]);var cls,color;
  if(first>=1&&first<=126){cls='Class A (Unicast)';color='var(--blu)';}else if(first>=128&&first<=191){cls='Class B (Unicast)';color='var(--grn)';}else if(first>=192&&first<=223){cls='Class C (Unicast)';color='var(--pur)';}else if(first>=224&&first<=239){cls='Class D (Multicast)';color='var(--amb)';}else{cls='Class E (Experimental)';color='var(--pnk)';}
  el.innerHTML='<span style="color:'+color+'">'+cls+'</span>';}

function demoCalc(){
  var ip=document.getElementById('demoIP').value.trim();var c=parseInt(document.getElementById('demoCIDR').value);
  if(!ip||ip.split('.').length!==4||isNaN(c)||c<1||c>31)return;
  var parts=ip.split('.').map(Number);var interesting=-1;var bitCount=0;
  for(var o=0;o<4;o++){if(bitCount>=c)break;var b=Math.min(8,c-bitCount);if(b<8)interesting=o;bitCount+=b;}
  if(interesting===-1)interesting=3;
  var maskParts=cidr2mask(c).split('.').map(Number);var magicVal=256-maskParts[interesting];if(c%8===0)magicVal=0;
  var ipI=ip2i(ip),maskI=(~((1<<(32-c))-1))>>>0,netI=(ipI&maskI)>>>0,bcastI=(netI|(~maskI>>>0))>>>0,firstI=(netI+1)>>>0,lastI=(bcastI-1)>>>0;
  var tot=Math.pow(2,32-c),use=Math.max(0,tot-2);
  var cls=parts[0]>=1&&parts[0]<=126?'A':parts[0]>=128&&parts[0]<=191?'B':parts[0]>=192&&parts[0]<=223?'C':'D/E';
  var h='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px">';
  h+='<div style="border:2px solid var(--red);padding:8px;border-radius:var(--rs);text-align:center;background:var(--panel)"><div style="font-size:.56rem;font-weight:800;color:var(--red);font-family:var(--mono)">NETWORK ID</div><div class="m" style="font-size:.82rem;font-weight:800;margin-top:3px;color:var(--bl)">'+i2ip(netI)+'</div></div>';
  h+='<div style="border:2px solid var(--grn);padding:8px;border-radius:var(--rs);text-align:center;background:var(--panel)"><div style="font-size:.56rem;font-weight:800;color:var(--grn);font-family:var(--mono)">FIRST HOST</div><div class="m" style="font-size:.82rem;font-weight:800;margin-top:3px;color:var(--bl)">'+i2ip(firstI)+'</div></div>';
  h+='<div style="border:2px solid var(--blu);padding:8px;border-radius:var(--rs);text-align:center;background:var(--panel)"><div style="font-size:.56rem;font-weight:800;color:var(--blu);font-family:var(--mono)">BROADCAST</div><div class="m" style="font-size:.82rem;font-weight:800;margin-top:3px;color:var(--bl)">'+i2ip(bcastI)+'</div></div>';
  h+='<div style="border:2px solid var(--grn);padding:8px;border-radius:var(--rs);text-align:center;background:var(--panel)"><div style="font-size:.56rem;font-weight:800;color:var(--grn);font-family:var(--mono)">LAST HOST</div><div class="m" style="font-size:.82rem;font-weight:800;margin-top:3px;color:var(--bl)">'+i2ip(lastI)+'</div></div>';
  h+='<div style="border:2px solid var(--pur);padding:8px;border-radius:var(--rs);text-align:center;background:var(--panel)"><div style="font-size:.56rem;font-weight:800;color:var(--pur);font-family:var(--mono)">USABLE HOSTS</div><div class="m" style="font-size:.82rem;font-weight:800;margin-top:3px;color:var(--bl)">'+use.toLocaleString()+'</div></div></div>';
  document.getElementById('demoResult').innerHTML=h;}

function showBinary(){var ip=document.getElementById('binIP').value.trim();var c=parseInt(document.getElementById('binCIDR').value);if(!ip||ip.split('.').length!==4||isNaN(c)||c<1||c>31)return;var parts=ip.split('.').map(Number);
  var h='<div class="binary-row">';var bi=0;

var pracDiff='easy',pracQ={},pracGScore=0,pracGTotal=0,pracStreak=0,pracIdx=0;
function genIP2(d){if(d==='easy')return pick([10,172,192])+'.'+pick([0,1,2,5,10,50])+'.'+pick([0,1,2,5,10])+'.'+RI(1,250);if(d==='medium')return pick([10,172,192,203])+'.'+RI(0,255)+'.'+RI(0,255)+'.'+RI(1,250);return RI(1,223)+'.'+RI(0,255)+'.'+RI(0,255)+'.'+RI(1,250);}
function genCIDR2(d){if(d==='easy')return pick([24,25,26,27,28]);if(d==='medium')return pick([22,23,24,25,26,27,28,29,30]);return pick([8,12,16,20,22,24,25,26,27,28,29,30]);}
function calcAns(ip,c){var ipI=ip2i(ip),mI=(~((1<<(32-c))-1))>>>0,nI=(ipI&mI)>>>0,bI=(nI|(~mI>>>0))>>>0;return{network:i2ip(nI),first:i2ip(nI+1),broadcast:i2ip(bI),last:i2ip(bI-1),hosts:Math.pow(2,32-c)-2};}

function setDiff2(d,btn){pracDiff=d;pracGScore=0;pracGTotal=0;pracStreak=0;pracIdx=0;document.querySelectorAll('.diff-btns button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');genPracQ2();}
function genPracQ2(){var ip=genIP2(pracDiff),c=genCIDR2(pracDiff);pracQ={ip:ip,cidr:c,ans:calcAns(ip,c)};document.getElementById('pracIP2').textContent=ip;document.getElementById('pracCIDR2').textContent='/'+c;document.getElementById('pracCount2').textContent='Q'+(pracIdx+1)+'/10';document.getElementById('pracProg2').style.width=(pracIdx/10*100)+'%';document.getElementById('pracFB2').innerHTML='';document.getElementById('pracWalk2').style.display='none';

function showWalk2(ip,c,ans){var parts=ip.split('.').map(Number);var bc=0,interesting=3;for(var o=0;o<4;o++){bc+=8;if(bc>=c){interesting=o;break;}}var mp=cidr2mask(c).split('.').map(Number);var mag=256-mp[interesting];if(c%8===0)mag=0;

  var msgs={dashboard:'Dashboard overview: '+SEGMENTS.length+' segments, '+ASSETS.length+' assets, '+SIEM_EVTS.filter(function(e){return e.sev==='critical'}).length+' critical alerts.',
  modules:'CyberCore 40-Module alignment matrix. Click any card to launch its corresponding range tool.',
  subnets:'IP Space by zone (Module 11 & 12).',seg:'Topology + flow matrix (Module 12 & 13).',vlans:'IEEE 802.1Q VLAN configuration (Module 12).',fwrules:FW_RULES.length+' firewall rules (Module 13).',assets:ASSETS.length+' enterprise fleet assets (Module 21).',
  topo:'Interactive architecture (Module 12).',siem:SIEM_EVTS.length+' SOC events (Module 25).',edr:'EDR endpoint telemetry (Module 24).',nmap:'Service enumeration scanner (Module 19).',wireshark:WK_PKTS.length+' captured frames (Module 11 & 28).',
  learn:'Subnetting mental models: Class boundaries, Magic number, 5 Values, Binary.',practice:'Practice drill generator (Module 11).',quiz:'60-second timed quiz.',cidr:'Complete /1-/32 reference guide.',
  calc:'CIDR calculator + FLSM splitter.',lab1:'Lab 1: Department Segmentation (Module 12).',lab2:'Lab 2: Zero Trust Rules (Module 13).',lab3:'Lab 3: Nmap Recon (Module 19).',lab4:'Lab 4: SIEM Incident (Module 25).',lab5:'Lab 5: Wireshark Forensics (Module 28).'};
  if(msgs[p])aiMsg(msgs[p]);
  renderSugs(['Modules','Subnetting','Zero Trust','Nmap Recon','SIEM Triage','Packet Forensics','VLANs']);
}
function aiMsg(t){aiChat.push({r:'bot',t:t});renderChat();}
function renderChat(){var el=document.getElementById('aiMsgs'),h='';aiChat.forEach(function(m){h+='<div class="ai-m '+m.r+'"><div class="av2">'+(m.r==='bot'?'AI':'U')+'</div><div class="bub">'+m.t+'</div></div>';});el.innerHTML=h;el.scrollTop=el.scrollHeight;}
function renderSugs(arr){var el=document.getElementById('aiSug');el.innerHTML='';if(!arr)return;arr.forEach(function(s){var b=document.createElement('button');b.textContent=s;b.onclick=function(){askAI(s)};el.appendChild(b);});}
function askAI(q){aiChat.push({r:'user',t:q});renderChat();setTimeout(function(){aiMsg(genReply(q));},350);}
function sendAI(){var inp=document.getElementById('aiIn'),q=inp.value.trim();if(!q)return;inp.value='';askAI(q);}
function genReply(q){q=q.toLowerCase();
  if(q.indexOf('module')>=0)return 'SXL-Network maps to CyberCore Modules 11 (Networking), 12 (Enterprise VLANs), 13 (Firewalls), 19 (Recon), 21 (Endpoints), 24 (EDR), 25 (SIEM), 26 (Incident Response), 28 (Malware/Wireshark), and 38 (Zero Trust).';
  if(q.indexOf('asset')>=0)return 'Click any asset in the fleet to view IP, MAC, open listening ports, segment, and trigger active Nmap scanning or quarantine.';
  if(q.indexOf('vlan')>=0)return 'VLANs divide physical switches into isolated broadcast domains. Each maps 1:1 with an IPv4 subnet prefix.';
  if(q.indexOf('nmap')>=0)return 'Nmap profiles: Quick (-F), Standard (-sS), Service Version (-sV), and Full Port (-p-). Target server 10.0.10.12 in Lab 3.';
  if(q.indexOf('cidr')>=0||q.indexOf('subnet')>=0)return 'Magic Number formula: 256 - Subnet Mask octet value. /25=128 increment, /26=64 increment, /27=32 increment.';
  if(q.indexOf('zero trust')>=0)return 'Zero Trust principle: Assume breach, verify explicitly, and enforce least-privilege micro-segmentation across all zones.';
  if(q.indexOf('siem')>=0)return 'SIEM correlates telemetry across firewalls, EDR, and switches. Critical alerts indicate active brute force or lateral pivot.';
  if(q.indexOf('packet')>=0||q.indexOf('wireshark')>=0)return 'Wireshark dissector decodes Ethernet II, IPv4 headers, TCP handshake flags (SYN/ACK), UDP DNS tunnels, and HTTP payloads.';
  return 'Ask about: Modules, Subnetting, Zero Trust, Nmap Recon, SIEM Triage, Packet Forensics, or VLANs.';
}

aiMsg('Welcome to <strong>ShadowXLab SXL-Network</strong>! Fully aligned with the 40-module CyberCore curriculum. 5 hands-on labs, 4 SOC tools, and full IPAM.');
renderSugs(['Modules','Subnetting','Zero Trust','Nmap Recon','SIEM Triage','Packet Forensics','VLANs']);
showPanel('dashboard');
</script>
